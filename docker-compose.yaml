x-node: &node
  build:
    context: ./
    dockerfile: Dockerfile
    tags:
      - ghcr.io/sempasha/super-dns-lookup:node-22-1.0.0
  image: ghcr.io/sempasha/super-dns-lookup:node-22-1.0.0
  user: node
  volumes:
    - ./:/app
  working_dir: /app

services:
  # Main container for running tests and development.
  app:
    <<: *node
    command: zsh
    depends_on:
      - dns
    dns: 10.10.1.3
    environment:
      DNS_SERVER_CONTROLLER_IP: 10.10.1.3
      DNS_SERVER_CONTROLLER_PORT: 80
      NODE_ENV: develop
    networks:
      default:
        ipv4_address: 10.10.1.2

  # DNS server with HTTP controller.
  # DNS server process may be found here file://./tests/bin/dns-server.ts.
  # HTTP controller client may be found here file://./tests/util/dns.ts.
  dns:
    <<: *node
    command: node --import tsx tests/bin/dns-server.ts
    environment:
      DNS_SERVER_FORWARD_REQUEST_FOR_HOSTS: registry.npmjs.com
      DNS_SERVER_IP: 0.0.0.0
      DNS_SERVER_PORT: 53
      DNS_SERVER_CONTROLLER_IP: 0.0.0.0
      DNS_SERVER_CONTROLLER_PORT: 80
    networks:
      default:
        ipv4_address: 10.10.1.3

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.1.0/24
